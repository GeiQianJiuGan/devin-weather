<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Window Weather</title>
    <meta name="description" content="Real-time 3D weather scene: a cafe window over a city intersection, following live weather." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <canvas id="scene" aria-label="3D weather simulator view"></canvas>
        <div id="loading"><span class="loading-dot"></span>Building the city&hellip;</div>
        <div id="toast" role="status" aria-live="polite"></div>
        <a id="github-link" href="https://github.com/GeiQianJiuGan/devin-weather" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Star on GitHub">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.77-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
          <span>Star on GitHub</span>
        </a>
        <button id="panel-toggle" type="button" title="Show or hide controls (H)" aria-label="Toggle control panel">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h8M16 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2" fill="currentColor"/><circle cx="8" cy="12" r="2" fill="currentColor"/><circle cx="14" cy="17" r="2" fill="currentColor"/></svg>
        </button>
      </main>
      <aside id="panel" aria-label="Simulation controls"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
